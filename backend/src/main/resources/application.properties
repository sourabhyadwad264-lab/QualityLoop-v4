server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/qualityloopv4?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Never show Java error details to the client
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Security
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=120
app.admin.password=${ADMIN_PASSWORD}
app.security.max-failed-attempts=5
app.security.lock-minutes=15

# CORS: the only website address allowed to call this API from a browser
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}

# Link used inside shared reports (change when the frontend is hosted online)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Email (Gmail example: use an App Password, not your normal password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Defect date window: "Detected on" may be at most this many days in the past
app.defect.max-backdate-days=7

# File uploads (photos, drawings): folder on disk and size limits
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Performance: compress JSON and text answers
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
